[project]
name = "multi-agent-poc-backend"
version = "0.1.0"
description = "Framework-free multi-agent support-triage POC — backend"
requires-python = ">=3.11"

# Deps are added phase-by-phase (kept minimal so images build fast).
dependencies = [
    # Phase 0 — web server + health checks
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    # Phase 1 — RAG: pgvector type adapter for asyncpg + text splitter + html->markdown fetcher
    "pgvector>=0.3.6",
    "langchain-text-splitters>=0.3",
    "markdownify>=0.13",
    # Phase 2 — LLM provider (Gemini now; anthropic added at swap time)
    "google-genai>=1.0",
    # Phase 5 — Model Context Protocol server + client
    "mcp>=1.2",
]
