# Multi-Agent Support Triage POC — local stack.
#
#   docker compose up -d --build        # db, embeddings, mcp, backend, frontend
#
# Ingest fetches KB pages over plain HTTP (backend), so no browser/crawler service is needed.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
      POSTGRES_DB: poc
    ports:
      - "5433:5432"   # host 5433 → container 5432 (your local Postgres 12 already owns host 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 5s
      timeout: 3s
      retries: 10

  embeddings:
    # Text Embeddings Inference — serves bge-small-en-v1.5 over HTTP on port 80.
    # First boot downloads the model (~130 MB) into the tei-data volume.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    ports:
      - "8080:80"
    volumes:
      - tei-data:/data

  backend:
    build: ./backend
    env_file: .env
    # Explicit upstream DNS so external fetches (ingest HTTP crawl, Gemini API) resolve even
    # when a host VPN breaks Docker's default resolver. Service names still resolve via 127.0.0.11.
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app   # hot-reload: edits on the host reload uvicorn
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started   # /health reports TEI readiness itself while the model loads

  mcp:
    # MCP server (Streamable HTTP on :9000/mcp) — reuses the backend image + code.
    build: ./backend
    command: ["python", "-m", "app.mcp_server"]
    env_file: .env
    ports:
      - "9000:9000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules          # keep container's node_modules, don't shadow with host
    depends_on:
      - backend

volumes:
  pgdata:
  tei-data:
